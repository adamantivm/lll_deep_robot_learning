[project]
name = "lll-deep-robot-learning"
version = "0.0.0"
description = "Team playground for robot learning (SO-101, LeRobot, MuJoCo)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # LeRobot with Feetech servo support (SO-100/SO-101) and training extras
    "lerobot[feetech,training]>=0.7",
    # Listed explicitly so they come from the CUDA index below
    "torch",
    "torchvision",
    "torchcodec",
    # Simulation
    "mujoco>=3.3",
    "gymnasium>=1.0",
    # Notebooks / plotting
    "ipykernel",
    "matplotlib",
]

[tool.uv]
# This is a workspace of experiments, not an installable package.
package = false

# PyTorch from the CUDA 13.0 index: needs NVIDIA driver >= 580 on the host and covers RTX 20-
# through 50-series (the cu126 build has no RTX 50-series support). PyPI's default wheels
# target the newest CUDA and need a very recent driver (`nvidia-smi` shows the max CUDA version).
[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
torchcodec = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100
